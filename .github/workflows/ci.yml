# CI workflow - runs the same commands as local development
#
# incitaciones is a skill/pnpm package (standardization.md §0.3 deviation):
# no Rust — CI validates content, links, headers, and the generated skill
# catalogs via `just ci`. The npm publish slot is npm-publish.yml (§1 mapping).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install ecosystem tools (§4 dogfood matrix, pinned)
        run: |
          cargo install --locked pretender@0.6.0 wai-cli@2026.9.28 dulce-de-leche@0.7.0
      - name: Install bd (beads, pinned §4)
        run: |
          curl -fsSL https://github.com/gastownhall/beads/releases/download/v1.3.0/beads_1.3.0_linux_amd64.tar.gz -o bd.tgz
          tar -xzf bd.tgz
          sudo mv bd /usr/local/bin/bd
      # §4 dogfood: installed tools must run, not just install
      - name: Smoke dogfooded tools
        env:
          DO_NOT_TRACK: "1"
        run: |
          bd list >/dev/null
          ddl status >/dev/null
          pretender check >/dev/null
      - name: Run CI pipeline
        run: just ci
