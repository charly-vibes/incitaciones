pre-commit:
  commands:
    # ddl:managed:start (pre-commit)
    ddl-ah-check:
      run: ah check
    ddl-pretender-gate:
      run: pretender check --mode gate
    ddl-spk-lint:
      run: spk lint openspec
    # ddl:managed:end (pre-commit)
# ah:managed:start
    ah-check:
      run: ah check
# ah:managed:end
    validate:
      run: just validate
    links:
      run: just check-links

pre-push:
  commands:
    # ddl:managed:start (pre-push)
    ddl-ah-check:
      run: ah check
    # ddl:managed:end (pre-push)
    distilled:
      run: just validate-distilled
    pi-package:
      run: just validate-pi-package
    skills-dir:
      run: just validate-skills-dir
